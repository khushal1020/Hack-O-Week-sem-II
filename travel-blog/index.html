<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Travel Experience</title>
    <meta name="description" content="A highly interactive, cinematic travel exploration website.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Cinematic Global Background -->
    <div id="cinematic-bg">
        <div class="bg-overlay-gradient"></div>
    </div>

    <!-- Main Container holding the sections -->
    <main id="app-container">
        <!-- Sections injected by JS -->
    </main>

    <!-- Overlay Modal for detailed view -->
    <div id="overlay" class="hidden">
        <div class="overlay-backdrop"></div>
        <div class="overlay-content">
            <button id="close-btn" aria-label="Close overlay">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div class="overlay-inner">
                <div class="overlay-image-container">
                    <img id="overlay-img" src="" alt="Destination">
                    <div class="overlay-img-gradient"></div>
                </div>
                <div class="overlay-text">
                    <h2 id="overlay-title">Title</h2>
                    
                    <div class="tabs-container">
                        <div class="tabs-header" id="overlay-tabs-header">
                            <!-- JS injected buttons -->
                        </div>
                        <div class="tabs-content-area" id="overlay-tabs-content">
                            <!-- JS injected panels -->
                        </div>
                    </div>

                    <div class="overlay-highlights-container">
                        <h3 class="highlights-title">Key Highlights</h3>
                        <ul id="overlay-highlights"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Application script -->
    <script src="script.js"></script>
</body>
</html>
